<!DOCTYPE html>
<html>
<head>
    <title>Navbar Facebook</title>

    <!-- Font Awesome -->
    <link rel ="stylesheet" 

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        nav {
            background-color: #ecde0f;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content:space-between;
            padding: 0 30px;
        }
        
        /* Logo facebook */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
        }
        .logo span {
            color: rgb(15, 14, 14);
            font-size: 24px;
            font-weight: bold;
        }

        /* Menu */
        .menu {
            display: flex;
            gap: 30px;
        }

        .menu a {
            color: rgb(10, 9, 9);
            text-decoration: none;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        /* Icon */ 
        .menu i {
            margin-right: 7px;
            font-size: 16px;
        }

        .menu a:hover {
            color: #f30d21;
        }

        /* Halaman Utama */
        .hero{
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #eaf3ff,#ffffff);
        }

        .hero-text{
            max-width: 700px;
        }

        .hero h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 50px;
            font-weight: bold;
            color: #af0d0d;
            margin-bottom: 15px;
        }

        .hero p {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 50px;
            font-weight: bold;
            color: #af0d0d;
            margin: 0;
        }

        .Button {
            display: flex;
            margin: 20rem auto 2rem;
            border-radius: 5px;
        }

           
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>

        <!-- Logo -->
        <div class="logo">
            <img src="download.jfif" alt="Logo">
            <span>Matador VBC</span>
        </div>

        <!-- Menu -->
        <div class="menu">
            <a href="#"><i class="fa-solid fa-house"></i>Beranda</a>
            <a href="#"><i class="fa-solid fa-user"></i>Profil</a>
            <a href="#"><i class="fa-solid fa-gear"></i>Pengaturan</a>
        </div>
    </nav>

    <button class= "Button">
        <input type="text" placeholder="Username":>
    </button>   
    
    <!-- Halaman Utama -->
    <section class="hero">
        <div class="hero-txt">
            <h1>Selamat Datang <i class="fa-solid fa-hand"></i></h1>
            <p>Matador Muda.</p>
        </div>
    </section>
    
</body>
</html>
