<!DOCTYPE html>
<html>
<head>
    <title>Navbar Facebook</title>

    <!-- Font Awesome -->
    <link rel ="stylesheet"

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        nav {
            background-color: #1877f2;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        
        /* Logo facebook */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo img {
            width: 40px;
            height: 40px;
        }
        .logo span {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* Menu */
        .menu {
            display: flex;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        /* Icon */ 
        .menu i {
            margin-right: 7px;
            font-size: 16px;
        }

        .menu a:hover {
            color: #dbe9ff;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>

        <!-- Logo -->
        <div class="logo">
            <img src="Facebook.logo.png" alt="Logo Facebook">
            <span>Facebook</span>
        </div>

        <!-- Menu -->
        <div class="menu">
            <a href="#"><i class="fa-solid fa-house"></i>Beranda</a>
            <a href="#"><i class="fa-solid fa-user"></i>Profil</a>
            <a href="#"><i class="fa-solid fa-gear"></i>Pengaturan</a>
        </div>
    </nav>

    <!-- Halaman Utama -->
    <div style="padding: 30px;">
    <h1>Selamat Datang</h1>
    <p>Ini adalah halaman utama website.</p>
    </div>
</body>
</html>
