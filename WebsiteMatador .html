<!DOCTYPE html>

    <link rel="stylesheet"

    <style>
        /* Mengatur semua elemen agar memiliki ukuran yang rapi */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Mengatur tampilan dasar halaman */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }

        /* Mengatur navbar atau menu bagian atas */
        nav {
            background-color: #ecde0f;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        /* Mengatur posisi logo dan nama website */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Mengatur ukuran gambar logo */
        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Mengatur tulisan nama website */
        .logo span {
            color: #0f0e0e;
            font-size: 24px;
            font-weight: bold;
        }

        /* Mengatur posisi menu navbar */
        .menu {
            display: flex;
            gap: 30px;
        }

        /* Mengatur tulisan pada menu */
        .menu a {
            color: #0a0909;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        /* Mengatur jarak ikon dengan tulisan */
        .menu i {
            margin-right: 7px;
        }

        /* Mengubah warna menu saat kursor diarahkan */
        .menu a:hover {
            color: #f30d21;
        }

        /* Mengatur halaman utama */
        .hero {
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #eaf3ff, #ffffff);
        }

        /* Mengatur lebar bagian teks utama */
        .hero-text {
            max-width: 700px;
        }

        /* Mengatur tulisan Selamat Datang */
        .hero h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;

            margin-bottom: 15px;

        /* Mengatur tulisan Matador Muda */
        .hero p {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 25px;
            font-weight: bold;
            color: #af0d0d;
            margin-bottom: 20px;
        }

        /* Mengatur tombol menuju halaman login */
        .btn {
            display: inline-block;
            background-color: #ecde0f;
            color: black;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Efek saat kursor berada di tombol */
        .btn:hover {
            background-color: #0cf00c;
        }

        /* Mengatur bagian halaman login */
        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Membuat kotak login */
        .login-box {
            background-color: white;
            width: 350px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }

        /* Mengatur judul login */
        .login-box h2 {
            text-align: center;
            color: #af0d0d;
            margin-bottom: 20px;
        }

        /* Mengatur label username dan password */
        .login-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        /* Mengatur kolom input */
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Mengatur tombol login */
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #ecde0f;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Efek tombol login ketika diarahkan */
        .login-box button:hover {
            background-color: #0be728;
        }

        /* Mengatur bagian bawah halaman */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Menyesuaikan tampilan pada layar HP */
        @media (max-width: 600px) {
            nav {
                height: auto;
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }

            .menu {
                gap: 15px;
                flex-wrap: wrap;

                font-size: 14px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {

            }

            .login-box {

                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar atau menu navigasi -->
    <nav>
        <!-- Logo dan nama Matador VBC -->
        <div class="logo">
            <img src="download.jfif" alt="Logo">
            <span>Matador VBC</span>
        </div>

        <!-- Menu navigasi untuk berpindah bagian -->
        <div class="menu">
            <a href="#beranda">
                <i class="fa-solid fa-house"></i>Beranda
            </a>

            <a href="#profil">
                <i class="fa-solid fa-user"></i>Profil
            </a>

            <a href="#login">
                <i class="fa-solid fa-right-to-bracket"></i>Login
            </a>
        </div>
    </nav>

    <!-- Halaman utama website -->
    <section class="hero" id="beranda">
        <div class="hero-text">

            <!-- Tulisan selamat datang -->
            <h1>
                Selamat Datang
                <i class="fa-solid fa-hand"></i>
            </h1>

            <!-- Nama atau slogan klub -->
            <p>Matador Muda</p>

            <!-- Tombol untuk menuju login -->
            <a href="#login" class="btn">Login Sekarang</a>

        </div>
    </section>

    <!-- Bagian profil singkat 
    <section class="hero" id="profil">
        <div class="hero-text">
            <h1>Profil Matador VBC</h1>
            <p>
                Bersama membangun kekompakan,
                semangat, dan prestasi dalam olahraga bola voli.
            </p>
        </div>
    </section>
    -->
    <!-- Halaman login -->
    <section class="login-section" id="login">
        <div class="login-box">

            <!-- Judul pada kotak login -->
            <h2>Login Matador VBC</h2>

            <!-- Form untuk memasukkan akun -->
            <form onsubmit="login(event)">

                <!-- Kolom username -->
                <label for="username">Username</label>
                <input type="text" id="username"
                placeholder="Masukkan username" required>

                <!-- Kolom password -->
                <label for="password">Password</label>
                <input type="password" id="password"
                placeholder="Masukkan password" required>

                <!-- Tombol untuk mengirim form -->
                <button type="submit">Masuk</button>

            </form>
        </div>
    </section>

    <!-- Bagian footer -->
    <footer>
        <p>&copy; 2026 Matador VBC</p>
    </footer>

    <!-- JavaScript untuk contoh interaksi login -->
    <script>
        function login(event) {
            // Mencegah halaman dimuat ulang
            event.preventDefault();

            // Mengambil nilai username
            let username = document.getElementById("username").value;

            // Menampilkan pesan setelah form diisi
            alert("Halo " + username + ", form berhasil diisi!");
        }
    </script>

</body>
</html>
